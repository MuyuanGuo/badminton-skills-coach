name: Package and attest release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  validated-main:
    name: Reuse exact-SHA main validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require the signed tag to point at main history
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signers"
          git verify-tag "$RELEASE_TAG"

      - name: Wait for successful validation of the exact main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/require_successful_validation.py
          --repository "${{ github.repository }}"
          --sha "${{ github.sha }}"
          --workflow validate.yml
          --branch main

  release:
    needs: validated-main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require the tag to point at main history
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signers"
          git verify-tag "$RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Require reproducible current-runtime release answers
        run: python scripts/validate_live_generation_results.py

      - name: Package archive and generate SBOM
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="dist/liuhui-badminton-coach-${VERSION}.zip"
          python scripts/package_skill_release.py --version "$VERSION" --output-dir dist
          python scripts/generate_release_sbom.py \
            --archive "$ARCHIVE" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --output dist/SBOM.cdx.json \
            --checksum-file dist/SHA256SUMS.txt

      - name: Attest archive and SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/liuhui-badminton-coach-*.zip
          sbom-path: dist/SBOM.cdx.json

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG already exists; refusing to overwrite immutable assets"
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Badminton Skills Coach $RELEASE_TAG"
