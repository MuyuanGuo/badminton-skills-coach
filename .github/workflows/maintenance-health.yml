name: Check knowledge maintenance health

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check committed maintenance state
        run: |
          python scripts/check_maintenance_health.py \
            --github-summary \
            --fail-on overdue

      - name: Sample live Douyin link reachability
        run: >-
          python scripts/check_video_links.py
          --network
          --sample-size 12
          --timeout 15
          --output "$RUNNER_TEMP/video-link-health.json"

      - name: Publish link-monitor summary
        env:
          LINK_REPORT: ${{ runner.temp }}/video-link-health.json
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["LINK_REPORT"]).read_text())
          print("## Live video-link sample")
          print(f"- Sampled: {report['sample_size']}")
          print(f"- Reachable: {report['sample_size'] - report['network_failures']}")
          print(f"- Failed signals: {report['network_failures']}")
          for item in report["network_checks"]:
              state = "reachable" if item["reachable"] else "signal failed"
              print(f"- `{item['video_id']}`: {state} ({item['http_status']})")
          PY
