name: Enforce pull request branch policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep main limited to releases and emergency fixes
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE_BRANCH" != "main" ]; then
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "Pull requests to main must come from a branch in the protected repository." >&2
            exit 1
          fi
          case "$HEAD_BRANCH" in
            release/*|hotfix/*|codex/release-*|codex/hotfix-*) ;;
            *)
              echo "Pull requests to main must use a release/* or hotfix/* branch." >&2
              echo "Normal feature, data, documentation, and CI work targets develop." >&2
              exit 1
              ;;
          esac
