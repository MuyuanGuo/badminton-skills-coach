name: Propose main to develop sync

on:
  workflow_run:
    workflows: ["Validate knowledge pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  propose-sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-main-to-develop
    steps:
      - name: Check out validated main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge validated main into current develop
        env:
          VALIDATED_MAIN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git switch -C "$SYNC_BRANCH" origin/develop
          git merge --no-ff --no-edit "$VALIDATED_MAIN_SHA"

      - name: Prepare the next development state
        run: |
          python scripts/prepare_develop_sync.py
          python scripts/build_manifest.py
          python scripts/generate_release_answer_results.py --generated-at "$(date -u +%F)"

      - name: Refresh development evaluation reports
        run: |
          python scripts/collect_evaluation_results.py \
            --output "$RUNNER_TEMP/core-evaluations.json"
          python scripts/generate_evaluation_report.py \
            --write \
            --evaluations "$RUNNER_TEMP/core-evaluations.json"

      - name: Push the synchronization branch
        run: |
          git add README.md README.en.md config/feedback_rules.json \
            skills/liuhui-badminton-coach/references/feedback-rules.json \
            .github/ISSUE_TEMPLATE/bug-report.yml \
            .github/ISSUE_TEMPLATE/question.yml \
            .github/ISSUE_TEMPLATE/skill-feedback.yml \
            data/knowledge/build_manifest.json \
            skills/liuhui-badminton-coach/references/build-manifest.json \
            data/evaluation/live_generation_results.json \
            data/evaluation/evaluation_report.json \
            docs/evaluation/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync main into the next development version"
          fi
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Create or update the develop synchronization PR
        run: |
          pr_url="$(gh pr list --state open --base develop --head "$SYNC_BRANCH" --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base develop \
              --head "$SYNC_BRANCH" \
              --title "Sync validated main into develop" \
              --body "Automated back-merge after a successful main validation. This also advances the development channel to the next patch prerelease while retaining the newly released stable install version.")"
          fi
          echo "Synchronization PR: $pr_url"

      - name: Approve the bot-created PR validation
        run: |
          head_sha="$(git rev-parse HEAD)"
          for attempt in {1..30}; do
            run_state="$(
              gh run list \
                --workflow validate.yml \
                --branch "$SYNC_BRANCH" \
                --event pull_request \
                --limit 20 \
                --json databaseId,headSha,status,conclusion \
                --jq ".[] | select(.headSha == \"$head_sha\") | [.databaseId, .status, .conclusion] | @tsv" \
                | head -n 1
            )"
            if [ -z "$run_state" ]; then
              sleep 2
              continue
            fi

            IFS=$'\t' read -r run_id status conclusion <<< "$run_state"
            if [ "$conclusion" = "action_required" ]; then
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              exit 0
            fi
            case "$status" in
              queued|in_progress|completed) exit 0 ;;
            esac
          done

          echo "Timed out waiting for the pull_request validation run for $head_sha" >&2
          exit 1
