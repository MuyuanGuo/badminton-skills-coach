name: Validate knowledge pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    name: Classify change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.scope.outputs.static }}
      artifact: ${{ steps.scope.outputs.artifact }}
      quality: ${{ steps.scope.outputs.quality }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            echo "static=true" >> "$GITHUB_OUTPUT"
            echo "artifact=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed paths were found; failing closed to full validation." >&2
            echo "static=true" >> "$GITHUB_OUTPUT"
            echo "artifact=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/classify_ci_scope.py "${changed[@]}" >> "$GITHUB_OUTPUT"

  static-and-unit:
    name: Static and unit tests (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "${{ matrix.python }}"

      - name: Install hash-locked quality tools
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint Python sources
        if: matrix.python == '3.12'
        run: ruff check scripts skills/liuhui-badminton-coach/scripts

      - name: Type-check architecture-critical modules
        if: matrix.python == '3.12'
        run: >-
          mypy
          scripts/project_update_lock.py
          scripts/queue_wal.py
          scripts/release_inventory.py
          skills/liuhui-badminton-coach/scripts/runtime_store.py
          skills/liuhui-badminton-coach/scripts/token_budget.py
          skills/liuhui-badminton-coach/scripts/render_answer.py

      - name: Compile Python sources
        run: python -m compileall -q scripts skills/liuhui-badminton-coach/scripts

      - name: Run fast tests
        run: python scripts/run_ci_tests.py fast

  core-evaluations:
    name: Core evaluations (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quality-report
            kind: evaluations
          - name: runtime-performance
            kind: performance
          - name: answer-packet
            kind: answer_packet
          - name: answer-context-1
            kind: context
            shard_index: 0
          - name: answer-context-2
            kind: context
            shard_index: 1
          - name: answer-context-3
            kind: context
            shard_index: 2
          - name: bilibili-canary-1
            kind: canary
            shard_index: 0
            shard_count: 6
          - name: bilibili-canary-2
            kind: canary
            shard_index: 1
            shard_count: 6
          - name: bilibili-canary-3
            kind: canary
            shard_index: 2
            shard_count: 6
          - name: bilibili-canary-4
            kind: canary
            shard_index: 3
            shard_count: 6
          - name: bilibili-canary-5
            kind: canary
            shard_index: 4
            shard_count: 6
          - name: bilibili-canary-6
            kind: canary
            shard_index: 5
            shard_count: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Collect core evaluations once
        if: matrix.kind == 'evaluations'
        run: python scripts/collect_evaluation_results.py --output "$RUNNER_TEMP/core-evaluations.json"

      - name: Check deterministic evaluation report
        if: matrix.kind == 'evaluations'
        run: python scripts/generate_evaluation_report.py --check --evaluations "$RUNNER_TEMP/core-evaluations.json"

      - name: Enforce runtime performance budgets
        if: matrix.kind == 'performance'
        run: python scripts/benchmark_runtime.py

      - name: Enforce 20-case compact answer-packet gate
        if: matrix.kind == 'answer_packet'
        run: python scripts/evaluate_answer_packet.py

      - name: Generate Bilibili mechanical wiring canaries
        if: matrix.kind == 'canary'
        run: >-
          python scripts/generate_bilibili_wiring_canaries.py
          --output "$RUNNER_TEMP/bilibili-wiring-canaries.json"

      - name: Validate Bilibili mechanical wiring canaries
        if: matrix.kind == 'canary'
        run: >-
          python scripts/evaluate_bilibili_wiring_canaries.py
          "$RUNNER_TEMP/bilibili-wiring-canaries.json"
          --shard-index ${{ matrix.shard_index }}
          --shard-count ${{ matrix.shard_count }}

      - name: Run answer-context regression shard
        if: matrix.kind == 'context'
        run: >-
          python scripts/run_ci_tests.py context
          --shard-index ${{ matrix.shard_index }}
          --shard-count 3

  artifact-validation:
    name: Artifact validation
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run artifact tests
        run: python scripts/run_ci_tests.py artifacts

      - name: Check generated manifest
        run: python scripts/build_manifest.py --check

      - name: Check committed video links
        run: python scripts/check_video_links.py

      - name: Run DOM regression tests
        run: |
          node scripts/test_bilibili_profile_snapshot_dom.mjs
          node scripts/test_douyin_profile_snapshot_dom.mjs
          node scripts/test_douyin_video_media_assets_dom.mjs
          node scripts/test_export_douyin_cookies_cdp.mjs

      - name: Validate repository artifacts
        run: python scripts/validate_project.py

  docs-validation:
    name: Documentation-only validation
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run documentation contracts
        run: python scripts/test_documentation_contracts.py

      - name: Run DOM regression tests
        run: |
          node scripts/test_bilibili_profile_snapshot_dom.mjs
          node scripts/test_douyin_profile_snapshot_dom.mjs
          node scripts/test_douyin_video_media_assets_dom.mjs

  validate:
    name: validate
    if: always()
    needs:
      - changes
      - static-and-unit
      - core-evaluations
      - artifact-validation
      - docs-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation group to pass
        env:
          STATIC_RESULT: ${{ needs.static-and-unit.result }}
          CORE_RESULT: ${{ needs.core-evaluations.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-validation.result }}
          DOCS_RESULT: ${{ needs.docs-validation.result }}
        run: |
          for result in "$STATIC_RESULT" "$CORE_RESULT" "$ARTIFACT_RESULT" "$DOCS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Validation dependency finished with: $result" >&2; exit 1 ;;
            esac
          done
