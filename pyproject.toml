[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"skills/liuhui-badminton-coach/scripts/*.py" = ["E402"]
"skills/liuhui-badminton-coach/scripts/feedback_ranking.py" = ["F821"]
"skills/liuhui-badminton-coach/scripts/query_planning.py" = ["F821"]
"skills/liuhui-badminton-coach/scripts/retrieval_projection.py" = ["F821"]
"skills/liuhui-badminton-coach/scripts/retrieval_ranking.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
